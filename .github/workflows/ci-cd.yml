name: H4T-Admin-FE-CI-CD-Workflow

on:
  push:
    branches:
      - enhancement/add-update-services
      - main
      - stage

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20.11.0"

      - name: Install dependencies
        run: npm install

      - name: Build app production
        if: github.ref == 'refs/heads/main'
        run: npm run build:prod

      - name: Build app enhancement/add-update-servicesment
        if: github.ref == 'refs/heads/enhancement/add-update-services'
        run: npm run build:dev

      - name: Build app staging
        if: github.ref == 'refs/heads/stage'
        run: npm run build:stage

      # upload to s3 bucket of prod
      - name: Upload to S3 Prod
        if: github.ref == 'refs/heads/main'
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          SOURCE_DIR: build/
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET_PROD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # invalidate outdated cache
      - name: Cloudfront Cache Invalidation Prod
        if: github.ref == 'refs/heads/main'
        uses: chetan/invalidate-cloudfront-action@master
        env:
          DISTRIBUTION: ${{ secrets.AWS_DISTRIBUTION_PRODUCTION }}
          PATHS: '/*'
          AWS_REGION: 'us-east-1'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # upload to s3 bucket of dev
      - name: Upload to S3 Dev enhancement/add-update-services
        if: github.ref == 'refs/heads/enhancement/add-update-services'
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          SOURCE_DIR: build/
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET_DEV }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # invalidate outdated cache
      - name: Cloudfront Cache Invalidation Dev
        if: github.ref == 'refs/heads/enhancement/add-update-services'
        uses: chetan/invalidate-cloudfront-action@master
        env:
          DISTRIBUTION: ${{ secrets.AWS_DISTRIBUTION_enhancement/add-update-servicesMENT }}
          PATHS: '/*'
          AWS_REGION: 'us-east-1'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 
      # upload to s3 bucket of stage
      - name: Upload to S3 stage
        if: github.ref == 'refs/heads/stage'
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --acl public-read
        env:
          SOURCE_DIR: build/
          AWS_S3_BUCKET: admin.stage.health4travel.com
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # invalidate outdated cache
      - name: Cloudfront Cache Invalidation Stage
        if: github.ref == 'refs/heads/stage'
        uses: chetan/invalidate-cloudfront-action@master
        env:
          DISTRIBUTION: ${{ secrets.AWS_DISTRIBUTION_STAGING }}
          PATHS: '/*'
          AWS_REGION: 'eu-north-1'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
